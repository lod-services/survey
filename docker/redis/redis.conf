# Redis Configuration for Production
# Security
protected-mode yes
bind 127.0.0.1

# Memory and Performance
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Network
timeout 300
tcp-keepalive 300

# Performance tuning
tcp-backlog 511
databases 16

# Security settings for production
# requirepass your_secure_redis_password_here