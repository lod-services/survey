# Pre-commit hooks for security and code quality
# Install with: pip install pre-commit && pre-commit install

repos:
  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '.*\.(lock|min\.js|min\.css)$'

  # Additional security checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10MB limit
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-executables-have-shebangs

  # Prevent common secret patterns
  - repo: local
    hooks:
      - id: check-env-files
        name: Check for environment files with secrets
        entry: bash -c 'if find . -name ".env*" -not -path "./.env.example" -not -path "./.env.*.example" -not -path "./.*" | grep -v ".env.example" | head -1; then echo "ERROR: Environment files detected. Use .env.local for secrets."; exit 1; fi'
        language: system
        files: '^\.env'
        pass_filenames: false

      - id: app-secret-check
        name: Check for hardcoded APP_SECRET patterns
        entry: bash -c 'if git diff --cached --name-only | xargs grep -l "APP_SECRET.*[a-f0-9]\{32,\}" 2>/dev/null; then echo "ERROR: Hardcoded APP_SECRET detected in staged files"; exit 1; fi'
        language: system
        pass_filenames: false