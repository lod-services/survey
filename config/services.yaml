parameters:
    # APP_SECRET validation configuration
    app.security.strict_mode: true

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # APP_SECRET validation listener
    App\EventListener\AppSecretValidationListener:
        arguments:
            $strictMode: '%app.security.strict_mode%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelEvent, priority: 1024 }